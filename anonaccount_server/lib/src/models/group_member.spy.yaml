class: GroupMember
table: group_member
indexes:
  group_member_signing_key_idx:
    fields: memberSigningPublicKeyHex
    unique: true
  group_member_unique_idx:
    fields: shareGroupId, anonAccountId
    unique: true
  group_member_account_idx:
    fields: anonAccountId
    unique: false
fields:
  id: UuidValue?, defaultPersist=random
  shareGroup: ShareGroup?, relation(onDelete=Cascade)
  anonAccount: AnonAccount?, relation(onDelete=Cascade)
  role: GroupMemberRole
  memberSigningPublicKeyHex: String
  memberEncryptionPublicKeyHex: String
  encryptedDataKey: String
  # The member KeyDuo JWK, encrypted with the account's ultimate encryption
  # public key — the same construction as AnonAccount.encryptedDataKey one
  # tier down. Non-nullable: every path that creates this row supplies it.
  encryptedMemberKey: String
  joinedAt: DateTime, default=now
  isRevoked: bool, default=false
  # Tightened from nullable to non-nullable: every group member row is
  # recorded as attested (rule 7). Fields stay null for callers that
  # legitimately have no signer — `addedBy*` is required for a row to
  # be considered attested.
  addedByAttestorPublicKeyHex: String
  addedByAttestation: String
  revokedByAttestorPublicKeyHex: String?
  revokedByAttestation: String?
  revokedAt: DateTime?
  # Reserved for key rotation. No endpoint reads it yet.
  keyEpoch: int, default=0
  # Set only when this row's role has been changed post-creation, via
  # changeGroupMemberRole. Null for a row whose role has never changed —
  # distinct from "changed at creation," which addedBy* already covers.
  roleChangedAt: DateTime?
  roleChangedByAttestorPublicKeyHex: String?
  roleChangedByAttestation: String?
