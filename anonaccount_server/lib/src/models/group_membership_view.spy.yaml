# `listMyGroups` row — what the SDK actually consumes.
#
# No `isRevoked`: `listMyGroups` already filters it, so the field would
# be a constant, and a hardcoded security flag is worse than an absent
# one.
class: GroupMembershipView
fields:
  memberId: UuidValue
  shareGroupId: UuidValue
  role: GroupMemberRole
  memberSigningPublicKeyHex: String
  memberEncryptedDataKey: String
  deviceEncryptedDataKey: String?
  joinedAt: DateTime
  # The caller's OWN backup. listMyGroups is already filtered to the
  # calling device's account, so this reaches nobody else.
  encryptedMemberKey: String
  encryptedUltimateKey: String?
