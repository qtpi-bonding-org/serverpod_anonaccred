# AnonAccount: Immutable identity root based on ECDSA P-256 public key
# Stores only public keys and encrypted data - never private keys or PII
class: AnonAccount
table: anon_account
indexes:
  ultimate_signing_key_idx:
    fields: ultimateSigningPublicKeyHex
    unique: true
fields:
  # UUID primary key — matches Serverpod AuthUser.id for JWT identity
  id: UuidValue?, defaultPersist=random

  # Ultimate ECDSA P-256 signing public key (130 lowercase hex chars,
  # SEC1 uncompressed `04||x||y`). The actual identity key — used by
  # resolveAccountUuidByUltimateKey, resolveAccountUuidByAnyKey, and
  # registerDevice to bind a device to its account.
  ultimateSigningPublicKeyHex: String

  # Recovery blob: Symmetric data key encrypted with ultimate encryption key
  # Server never decrypts this - used for account recovery
  encryptedDataKey: String

  # Ultimate ECDSA P-256 encryption public key (130 lowercase hex chars,
  # SEC1 uncompressed). Names state purpose and format; the signing key
  # above is the identity, this is the wrap target.
  ultimateEncryptionPublicKeyHex: String

  # Account creation timestamp
  createdAt: DateTime, default=now

  # Reserved for key rotation. No endpoint reads it yet.
  keyEpoch: int, default=0