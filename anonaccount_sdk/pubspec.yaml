name: anonaccount_sdk
description: Handcrafted Dart SDK for the anonaccount Serverpod module. Wraps anonaccount_client with crypto primitives, key generation, and account/pairing/groups protocol flows. Pure Dart, stateless, no Flutter dependencies.
version: 0.1.0
publish_to: none

environment:
  sdk: '^3.12.2'

dependencies:
  anonaccount_client:
    path: ../anonaccount_client
  anonaccount_protocol:
    path: ../anonaccount_protocol
  dart_jwk_duo:
    git:
      url: https://github.com/qtpi-bonding-org/dart_jwk_duo.git
      ref: 77f8e1b9901b46191ed3702fe1b709957f642475
  crypto: ^3.0.3
  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0
  meta: ^1.16.0

dev_dependencies:
  mocktail: ^1.0.4
  test: ^1.25.5
  build_runner: ^2.4.13
  freezed: ^3.2.5
  json_serializable: ^6.7.1
  lints: ^4.0.0
